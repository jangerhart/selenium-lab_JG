[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandix"
version = "0.1.0"
description = "Sandix Python project"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Sandix Team" }
]
dependencies = []

[project.scripts]
sandix = "sandix.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
