[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "blogbook"
version = "0.1.0"
description = "Create small translated EPUB e-books from blog posts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jan Gerhart" }]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "ebooklib>=0.18",
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "pydantic>=2.8.0",
  "readability-lxml>=0.8.1",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
blogbook = "blogbook.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/blogbook"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
  "B008",  # Typer uses Option/Argument defaults as its public API.
  "UP045", # Keep Python 3.9 parser compatibility.
]

[tool.pytest.ini_options]
addopts = "-q --cov=blogbook --cov-report=term-missing"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_configs = true
packages = ["blogbook"]

[[tool.mypy.overrides]]
module = ["ebooklib", "ebooklib.*", "readability", "readability.*"]
ignore_missing_imports = true
